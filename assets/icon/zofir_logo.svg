<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- squircle background -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="url(#bg)"/>
  <!-- subtle inner highlight -->
  <rect x="8" y="8" width="496" height="260" rx="120" fill="#FFFFFF" opacity="0.08"/>
  <!-- Z : top bar / diagonal / bottom bar -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <line x1="140" y1="162" x2="340" y2="162" stroke-width="58"/>
    <line x1="336" y1="168" x2="176" y2="340" stroke-width="58"/>
    <line x1="172" y1="350" x2="352" y2="350" stroke-width="58"/>
  </g>
  <!-- split gap dots on the diagonal (roommates) -->
  <circle cx="236" cy="262" r="13" fill="#0F766E"/>
  <circle cx="278" cy="222" r="13" fill="#0F766E"/>
  <!-- amber coin badge with split symbol -->
  <circle cx="376" cy="376" r="78" fill="url(#coin)"/>
  <circle cx="376" cy="376" r="78" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.9"/>
  <g fill="#FFFFFF">
    <circle cx="376" cy="348" r="11"/>
    <circle cx="376" cy="404" r="11"/>
  </g>
  <rect x="342" y="370" width="68" height="12" rx="6" fill="#FFFFFF"/>
</svg>
